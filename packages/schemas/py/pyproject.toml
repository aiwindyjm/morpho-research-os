[project]
name = "morpho-schemas"
version = "0.0.1"
description = "Pydantic bindings for the canonical Morpho Research OS JSON Schemas"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["morpho_schemas"]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]
