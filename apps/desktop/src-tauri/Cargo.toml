[package]
name = "morpho-desktop"
version = "0.0.1"
description = "Morpho Research OS desktop Rust core"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "morpho_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
# Real OS keychain adapter. keyring 3.x has no default features (the
# "default" store silently falls back to the in-memory mock), so the
# platform stores are enabled explicitly: Windows Credential Manager,
# macOS Keychain, and on Linux keyutils in-session plus Secret Service
# for persistence (crypto-rust keeps the build OpenSSL-free). The
# deps are target-gated upstream, so foreign targets stay lean. Unit
# tests swap in keyring::mock so CI never touches a real keychain.
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
# SHA-256 for the source-content cache's provable file↔fingerprint
# consistency check (round-2 review P1); already in the workspace's offline
# dependency cache.
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
