<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Morpho Research OS</title>
    <script>
      // ADR-022 FOUC guard: resolve the skin before first paint so the
      // module bundle's theme store never flashes the default palette.
      // Whitelist only; unknown/stale values fall back to lamplit-study.
      try {
        var t = localStorage.getItem("morpho.theme");
        document.documentElement.dataset.theme =
          t === "bio-luminal" || t === "lamplit-study" ? t : "lamplit-study";
      } catch (e) {
        document.documentElement.dataset.theme = "lamplit-study";
      }
      // ADR-023 FOUC guard: resolve the interface language before first paint
      // (same ladder as src/i18n — stored key → navigator zh → en) so
      // <html lang> matches what the bundle will render.
      try {
        var l = localStorage.getItem("morpho.lang");
        if (l !== "zh-CN" && l !== "en") {
          l = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh-CN" : "en";
        }
        document.documentElement.lang = l;
      } catch (e) {
        document.documentElement.lang = "zh-CN";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
