[project]
name = "morpho-research-worker"
# Kept in sync with the repository VERSION file until W0-03 defines the
# authoritative version-sync rule.
version = "0.0.1"
description = "Morpho Research OS local research worker (planning, DAG, search, extraction, normalization, validation)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
